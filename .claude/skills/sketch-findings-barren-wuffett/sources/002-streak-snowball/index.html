<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sketch 002 — Streak snowball</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../themes/cozy-dusk.css" id="theme-link" />
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; transition: background .2s ease; }
  img.px { image-rendering: pixelated; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ── sketch chrome (theme-independent) ─────────────────────────────── */
  #variant-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: rgba(12,10,18,.94); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-bottom: 1px solid rgba(255,255,255,.08); font: 12px/1.25 system-ui, sans-serif; color: #ddd; padding: 6px 8px; padding-top: calc(6px + env(safe-area-inset-top)); }
  #variant-nav .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
  #variant-nav .row::-webkit-scrollbar { display: none; }
  #variant-nav .row + .row { margin-top: 6px; }
  .variant-tab, .ctl, .nav-btn { flex: none; border: 1px solid rgba(255,255,255,.16); background: transparent; color: #ccc; border-radius: 6px; padding: 6px 9px; font: 600 12px system-ui, sans-serif; transition: all .15s ease; white-space: nowrap; }
  .variant-tab:hover, .ctl:hover, .nav-btn:hover { border-color: rgba(255,255,255,.45); color: #fff; }
  .variant-tab.active { background: #ffd166; color: #1d1a27; border-color: #ffd166; }
  .ctl.go { background: rgba(127,200,255,.18); border-color: #7fc8ff; color: #fff; }
  .ctl:active { transform: translateY(1px); }
  #nav-hide { margin-left: auto; }
  .slider { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .slider input { flex: 1; min-width: 80px; accent-color: #7fc8ff; }
  .slider output { font: 700 13px ui-monospace, Consolas, monospace; min-width: 26px; text-align: right; color: #fff; }
  #variant-nav select { background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 5px 4px; font: 12px system-ui; }
  .seg-inline { display: inline-flex; border: 1px solid rgba(255,255,255,.16); border-radius: 6px; overflow: hidden; flex: none; }
  .seg-inline button { border: 0; background: transparent; color: #aaa; padding: 6px 8px; font: 600 11.5px system-ui; }
  .seg-inline button.on { background: #7fc8ff; color: #111; }
  #nav-note { margin-top: 6px; color: #9aa; font-size: 11.5px; }
  #nav-show { position: fixed; top: calc(6px + env(safe-area-inset-top)); right: 8px; z-index: 9998; display: none; background: rgba(12,10,18,.8); color: #ddd; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 6px 9px; font: 600 12px system-ui, sans-serif; opacity: .65; }
  body.nav-hidden #variant-nav { display: none; }
  body.nav-hidden #nav-show { display: block; }

  #sketch-tools { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); right: 12px; z-index: 9999; font: 12px system-ui, sans-serif; color: #fff; }
  #tools-toggle { width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.7); color: #fff; font-size: 18px; opacity: .55; transition: opacity .2s; }
  #tools-toggle:hover, #sketch-tools.open #tools-toggle { opacity: 1; }
  #tools-panel { display: none; position: absolute; right: 0; bottom: 48px; width: 230px; background: rgba(0,0,0,.86); border-radius: 10px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #sketch-tools.open #tools-panel { display: block; }
  #tools-panel label { display: block; color: #aaa; margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #tools-panel label:first-child { margin-top: 0; }
  #tools-panel select { width: 100%; padding: 6px; border-radius: 6px; background: #222; color: #fff; border: 1px solid #444; font: 13px system-ui; }
  .seg { display: flex; gap: 4px; }
  .seg button { flex: 1; padding: 6px 4px; border-radius: 6px; border: 1px solid #444; background: #222; color: #ccc; font: 12px system-ui; transition: all .15s ease; }
  .seg button:hover { border-color: #888; }
  .seg button.on { background: #7fc8ff; border-color: #7fc8ff; color: #111; }
  #anno-tip { position: fixed; z-index: 10000; pointer-events: none; background: #111; color: #eee; font: 11px/1.45 ui-monospace, Consolas, monospace; padding: 6px 8px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.5); max-width: 280px; display: none; white-space: pre-wrap; }
  .anno-outline { outline: 1px dashed #ff4fd8 !important; outline-offset: 1px; }

  #stage { margin: 0 auto; transition: max-width .2s ease; }
  #stage.vp-phone { max-width: 375px; box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
  #stage.vp-tablet { max-width: 768px; box-shadow: 0 0 0 1px rgba(255,255,255,.06); }

  /* ── page ─────────────────────────────────────────────────────────── */
  .wrap { max-width: 460px; margin: 0 auto; padding: 16px 16px calc(80px + env(safe-area-inset-bottom)); }
  .hub-title { font-family: var(--font-pixel); font-size: 16px; line-height: 1.6; color: var(--color-primary); margin: 6px 0 4px; }
  .tagline { color: var(--color-text-muted); font-size: 16px; margin: 0 0 18px; line-height: 1.35; }

  .style { margin: 0 0 30px; scroll-margin-top: 150px; }
  .style-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .style-head .tag { font-family: var(--font-pixel); font-size: 11px; color: var(--color-bg); background: var(--color-primary); padding: 4px 6px 3px; border-radius: 4px; }
  .style-head h2 { font-size: 19px; font-weight: 600; margin: 0; }
  .style .why { color: var(--color-text-muted); font-size: 15px; line-height: 1.35; margin: 0 0 10px; }

  /* the winning strip from sketch 001 (variant C), at real size */
  .strip { display: flex; align-items: center; gap: 12px; background: var(--color-surface); border-radius: 18px; padding: 10px 14px 10px 10px; min-height: 64px; }
  .strip.solo { padding-left: 14px; }
  .hero { position: relative; display: flex; align-items: flex-end; gap: 2px; padding: 4px 10px 4px 6px; border-radius: 14px; background: color-mix(in srgb, var(--color-accent) 16%, var(--color-surface-2)); cursor: pointer; transition: opacity .3s ease; }
  .hero.hidden { display: none; }
  .hero .n { font-family: var(--font-pixel); font-size: 16px; margin-bottom: 4px; display: inline-block; }
  .hero img { transform-origin: 50% 100%; }
  .strip-main { display: flex; flex-direction: column; gap: 6px; }
  .daily { font-family: var(--font-pixel); font-size: 12px; color: var(--color-primary); }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--color-text-soft); }
  .box { width: 11px; height: 11px; border: 2px solid color-mix(in srgb, var(--game-arcade) 70%, var(--color-text-muted)); border-radius: 3px; transition: all .15s ease; }
  .box.on { background: var(--game-arcade); border-color: var(--game-arcade); }

  .ladder { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .rung { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 8px 6px; border-radius: 12px; background: var(--color-surface); border: 2px solid transparent; cursor: pointer; transition: all .15s ease; }
  .rung:hover { border-color: color-mix(in srgb, var(--color-primary) 35%, transparent); }
  .rung.now { border-color: var(--color-primary); }
  .rung .lbl { font-size: 13px; color: var(--color-text-muted); }
  .rung.now .lbl { color: var(--color-primary); }
  .big { margin-top: 12px; display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: var(--color-inset); }
  .big .meta { font-size: 14px; color: var(--color-text-muted); line-height: 1.45; }
  .big .meta b { color: var(--color-text); font-weight: 600; }

  .bubble { position: absolute; left: 0; top: calc(100% + 8px); z-index: 20; background: var(--color-text); color: var(--color-bg); font-family: var(--font-sans); font-size: 14px; line-height: 1.25; padding: 7px 10px; border-radius: 8px; white-space: nowrap; box-shadow: var(--shadow-md); animation: pop .18s ease-out; }
  .bubble::before { content: ''; position: absolute; left: 18px; top: -5px; width: 10px; height: 10px; background: var(--color-text); transform: rotate(45deg); }

  /* growth moments */
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes grow { 0% { transform: scale(.55); } 55% { transform: scale(1.22, 1.1); } 78% { transform: scale(.95, 1.04); } 100% { transform: none; } }
  @keyframes nudge { 0% { transform: translateX(-6px); } 55% { transform: translateX(2px); } 100% { transform: none; } }
  @keyframes appear { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: none; } }
  @keyframes numpop { 0% { transform: scale(1); } 40% { transform: scale(1.4); color: var(--color-primary); } 100% { transform: scale(1); } }
  @keyframes spark { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
  .a-grow { animation: grow .55s cubic-bezier(.2,.8,.2,1); }
  .a-nudge { animation: nudge .4s ease-out; }
  .a-appear { animation: appear .45s ease-out; }
  .a-num { animation: numpop .45s ease-out; }
  .spark { position: absolute; width: 4px; height: 4px; background: #fff; box-shadow: 0 0 0 1px #1c1824; animation: spark .6s ease-out forwards; pointer-events: none; }

  .toast { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); z-index: 80; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; background: var(--color-text); color: var(--color-bg); font-size: 15px; padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow-md); transition: all .2s ease; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div id="variant-nav">
  <div class="row">
    <button class="variant-tab active" data-v="plain">A: Plain ★ Selected</button>
    <button class="variant-tab" data-v="pickup">B: Picks things up</button>
    <button class="variant-tab" data-v="hill">C: Long hill</button>
    <button class="nav-btn" id="nav-hide" title="Hide the sketch bar">▴</button>
  </div>
  <div class="row">
    <label class="slider">Streak <input type="range" id="streak" min="1" max="60" value="1" /> <output id="streak-out">1</output></label>
  </div>
  <div class="row">
    <button class="ctl go" id="finish">▶ Finish a daily</button>
    <button class="ctl" id="miss">Miss a day</button>
    <select id="milestones" title="Size steps">
      <option value="3,7,14,30" selected>steps 3·7·14·30 ★</option>
      <option value="3,7,30">steps 3·7·30</option>
      <option value="2,5,10,30">steps 2·5·10·30</option>
      <option value="7,30,100">steps 7·30·100</option>
    </select>
  </div>
  <div class="row">
    <span style="color:#aaa;font-size:11.5px">After a miss, the strip:</span>
    <div class="seg-inline" id="miss-mode"><button data-m="hide">hides the snowball</button><button data-m="keep" class="on">keeps the old number ★</button></div>
  </div>
  <div id="nav-note"></div>
</div>
<button id="nav-show">▾ sketch</button>

<div id="stage">
  <main class="wrap">
    <h1 class="hub-title">BARREN WUFFETT</h1>
    <p class="tagline">Daily games about patience, compounding and a very moody Mr. Market.</p>
    <div id="styles"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div id="sketch-tools">
  <div id="tools-panel">
    <label>Palette</label>
    <select id="theme-switcher">
      <option value="cozy-dusk">Cozy dusk ★ Selected (001)</option>
      <option value="default">Spike plum</option>
      <option value="navy">Navy</option>
    </select>
    <label>Viewport</label>
    <div class="seg" id="vp-seg"><button data-vp="phone">Phone</button><button data-vp="tablet">Tablet</button><button data-vp="full" class="on">Full</button></div>
    <label>Snowball scale in the strip</label>
    <div class="seg" id="scale-seg"><button data-sc="2">2×</button><button data-sc="3" class="on">3× (as in 001)</button></div>
    <label>Annotate (tap/hover shows styles)</label>
    <div class="seg" id="anno-seg"><button data-a="off" class="on">Off</button><button data-a="on">On</button></div>
  </div>
  <button id="tools-toggle" title="Sketch tools">⚙</button>
</div>
<div id="anno-tip"></div>

<script type="module">
import { dataURL } from '../../spikes/002-old-barren-cast/cast.js';
import { SNOW_STYLES, stepFor } from '../_lib/hubsprites.js';

const STYLES = [
  { key: 'plain', tag: 'A', why: 'Just grows. The quietest reward, and it reads at any size.' },
  { key: 'pickup', tag: 'B', why: 'Gathers things as it rolls: a twig after the first step, a coin halfway, a Cherry Fizz can at the last milestone. Each milestone adds something to spot.' },
  { key: 'hill', tag: 'C', why: 'Rolls down a snowy slope, and the track behind it gets longer. "A long hill" made visible. It is wider, so the strip\'s hero box widens too.' },
];

const S = { streak: 1, daily: 1, doneToday: true, missed: false, milestones: [3, 7, 14, 30], scale: 3, missMode: 'keep', theme: 'cozy-dusk' };

// ── sprite cache ──────────────────────────────────────────────────────
const cache = new Map();
function snowSrc(key, step, total, scale) {
  const k = `${key}:${step}/${total}@${scale}`;
  if (!cache.has(k)) {
    const spr = SNOW_STYLES[key].make(step, total);
    cache.set(k, { url: dataURL(spr, scale), w: spr.w * scale, h: spr.h * scale });
  }
  return cache.get(k);
}
const snowImg = (key, step, total, scale, cls = '') => {
  const s = snowSrc(key, step, total, scale);
  return `<img class="px ${cls}" alt="" width="${s.w}" height="${s.h}" src="${s.url}">`;
};

// ── render ────────────────────────────────────────────────────────────
const total = () => S.milestones.length;
const step = () => stepFor(S.streak, S.milestones);
const showSnow = () => !(S.missed && S.missMode === 'hide');

function sectionHTML(st) {
  const t = total(), stp = step();
  const rungs = [1, ...S.milestones].map((d, i) =>
    `<div class="rung ${i === stp ? 'now' : ''}" data-day="${d}">${snowImg(st.key, i, t, st.key === 'hill' ? 2 : 3)}<span class="lbl">day ${d}${i === t ? '+' : ''}</span></div>`).join('');
  const nextM = S.milestones.find(m => m > S.streak);
  return `<section class="style" id="s-${st.key}">
    <div class="style-head"><span class="tag">${st.tag}</span><h2>${SNOW_STYLES[st.key].label}</h2></div>
    <p class="why">${st.why}</p>
    <div class="strip ${showSnow() ? '' : 'solo'}">
      <div class="hero ${showSnow() ? '' : 'hidden'}" data-tip="${S.streak} day${S.streak === 1 ? '' : 's'} in a row with a finished daily">
        <span class="ball">${snowImg(st.key, stp, t, S.scale)}</span><span class="n">${S.streak}</span>
      </div>
      <div class="strip-main">
        <span class="daily">DAILY #${S.daily}</span>
        <span class="check"><span class="boxes"><span class="box ${S.doneToday ? 'on' : ''}"></span></span>${S.doneToday ? 1 : 0}/1 today</span>
      </div>
    </div>
    <div class="ladder">${rungs}</div>
    <div class="big">${snowImg(st.key, stp, t, 6)}<div class="meta">Step <b>${stp + 1} of ${t + 1}</b> at streak <b>${S.streak}</b><br>${nextM ? `next size at day ${nextM}` : 'full size'}</div></div>
  </section>`;
}

function render() {
  document.getElementById('styles').innerHTML = STYLES.map(sectionHTML).join('');
  document.getElementById('streak').value = Math.min(S.streak, 60);
  document.getElementById('streak-out').textContent = S.streak;
  const why = S.missed
    ? (S.missMode === 'hide' ? 'Missed a day: the snowball is gone from the strip, with no message. Finish a daily to start a fresh one at 1.'
                             : 'Missed a day: the strip still shows the old streak. Finish a daily to see it drop to 1.')
    : `Streak ${S.streak}, Daily #${S.daily}. Tap ▶ to play the growth moment; it pops with sparks when it reaches a new size.`;
  document.getElementById('nav-note').textContent = why;
}

// growth moment: re-render, then animate each hero by what happened
function animate(kind) {
  for (const hero of document.querySelectorAll('.hero:not(.hidden)')) {
    const img = hero.querySelector('img'), n = hero.querySelector('.n');
    img.classList.add(kind === 'grow' ? 'a-grow' : kind === 'appear' ? 'a-appear' : 'a-nudge');
    n.classList.add('a-num');
    if (kind === 'grow') sparks(hero, img);
  }
}
function sparks(hero, img) {
  const hb = hero.getBoundingClientRect(), ib = img.getBoundingClientRect();
  const cx = ib.left - hb.left + ib.width / 2, cy = ib.top - hb.top + ib.height * 0.55;
  for (let i = 0; i < 8; i++) {
    const a = (Math.PI * 2 * i) / 8 + Math.random() * 0.4, r = 22 + Math.random() * 12;
    const s = document.createElement('span');
    s.className = 'spark';
    s.style.left = cx - 2 + 'px'; s.style.top = cy - 2 + 'px';
    s.style.setProperty('--dx', Math.round(Math.cos(a) * r / 2) * 2 + 'px');
    s.style.setProperty('--dy', Math.round(Math.sin(a) * r / 2) * 2 - 6 + 'px');
    hero.appendChild(s);
    setTimeout(() => s.remove(), 650);
  }
}

// ── controls ──────────────────────────────────────────────────────────
document.getElementById('finish').onclick = () => {
  const before = step(), wasHidden = !showSnow();
  if (S.doneToday) S.daily += 1;                  // finishing tomorrow's daily
  if (S.missed) { S.streak = 1; S.missed = false; } else { S.streak += 1; }
  S.doneToday = true;
  render();
  animate(wasHidden ? 'appear' : step() > before ? 'grow' : 'nudge');
};
document.getElementById('miss').onclick = () => {
  if (S.missed) return;
  S.daily += S.doneToday ? 2 : 1;                 // a whole day went by unfinished; now it's the next one
  S.doneToday = false; S.missed = true;
  render();
};
document.getElementById('streak').oninput = e => {
  S.streak = +e.target.value; S.missed = false; S.doneToday = true; S.daily = Math.max(S.daily, S.streak);
  render();
};
document.getElementById('milestones').onchange = e => { S.milestones = e.target.value.split(',').map(Number); render(); };
document.getElementById('miss-mode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.missMode = b.dataset.m;
  for (const x of document.querySelectorAll('#miss-mode button')) x.classList.toggle('on', x === b);
  render();
});
document.getElementById('styles').addEventListener('click', e => {
  if (annotate) return;
  const rung = e.target.closest('.rung');
  if (rung) { S.streak = +rung.dataset.day; S.missed = false; S.doneToday = true; S.daily = Math.max(S.daily, S.streak); render(); return; }
  const hero = e.target.closest('.hero');
  if (hero) {
    document.querySelectorAll('.bubble').forEach(b => b.remove());
    const b = document.createElement('span'); b.className = 'bubble'; b.textContent = hero.dataset.tip;
    hero.appendChild(b); setTimeout(() => b.remove(), 2400);
  }
});

// variant tabs scroll to their section and track the one in view
document.querySelectorAll('.variant-tab').forEach(t => t.addEventListener('click', () => {
  document.getElementById('s-' + t.dataset.v)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}));
const markTab = () => {
  const navH = document.getElementById('variant-nav').offsetHeight;
  let cur = 'plain';
  for (const st of STYLES) { const el = document.getElementById('s-' + st.key); if (el && el.getBoundingClientRect().top < navH + 120) cur = st.key; }
  for (const t of document.querySelectorAll('.variant-tab')) t.classList.toggle('active', t.dataset.v === cur);
};
addEventListener('scroll', markTab, { passive: true });

const nav = document.getElementById('variant-nav');
const fitNav = () => { document.body.style.paddingTop = document.body.classList.contains('nav-hidden') ? '0px' : nav.offsetHeight + 'px'; };
new ResizeObserver(fitNav).observe(nav);
document.getElementById('nav-hide').onclick = () => { document.body.classList.add('nav-hidden'); fitNav(); };
document.getElementById('nav-show').onclick = () => { document.body.classList.remove('nav-hidden'); fitNav(); };

// ── sketch tools ──────────────────────────────────────────────────────
const tools = document.getElementById('sketch-tools');
document.getElementById('tools-toggle').onclick = () => tools.classList.toggle('open');
const themeSel = document.getElementById('theme-switcher');
themeSel.onchange = () => { S.theme = themeSel.value; document.getElementById('theme-link').href = `../themes/${S.theme}.css`; };
const seg = (id, attr, fn) => document.getElementById(id).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const x of document.querySelectorAll(`#${id} button`)) x.classList.toggle('on', x === b);
  fn(b.dataset[attr]);
});
seg('vp-seg', 'vp', vp => { document.getElementById('stage').className = vp === 'full' ? '' : 'vp-' + vp; });
seg('scale-seg', 'sc', sc => { S.scale = +sc; render(); });
let annotate = false;
const tip = document.getElementById('anno-tip');
let annoEl = null;
seg('anno-seg', 'a', a => { annotate = a === 'on'; if (!annotate) { tip.style.display = 'none'; annoEl?.classList.remove('anno-outline'); } });
function showAnno(el, x, y) {
  annoEl?.classList.remove('anno-outline'); annoEl = el; el.classList.add('anno-outline');
  const cs = getComputedStyle(el), r = el.getBoundingClientRect();
  const fam = cs.fontFamily.split(',')[0].replace(/['"]/g, '');
  tip.textContent = `${el.tagName.toLowerCase()}${el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).filter(c => c !== 'anno-outline').join('.') : ''}\n` +
    `${Math.round(r.width)}×${Math.round(r.height)}  pad ${cs.padding}\nfont ${cs.fontWeight} ${cs.fontSize} ${fam}\ncolor ${cs.color}\nbg ${cs.backgroundColor}`;
  tip.style.display = 'block';
  tip.style.left = Math.min(x + 12, innerWidth - 290) + 'px';
  tip.style.top = Math.min(y + 12, innerHeight - 100) + 'px';
}
document.getElementById('stage').addEventListener('pointerover', e => { if (annotate && e.pointerType === 'mouse') showAnno(e.target, e.clientX, e.clientY); });
document.getElementById('stage').addEventListener('click', e => { if (annotate) { e.preventDefault(); e.stopPropagation(); showAnno(e.target, e.clientX, e.clientY); } }, true);

window.__SKETCH__ = { S, render, animate, ready: true };
render();
</script>
